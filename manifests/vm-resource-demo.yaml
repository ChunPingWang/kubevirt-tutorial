apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-resource-demo
spec:
  runStrategy: Always
  template:
    spec:
      domain:
        cpu:
          cores: 2
          sockets: 1
          threads: 1
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        memory:
          guest: 256Mi
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/kubevirt/cirros-container-disk-demo:latest
